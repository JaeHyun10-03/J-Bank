server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: jbank-api
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

jbank:
  batch:
    interest:
      rounding-mode: DOWN
    ctr:
      threshold-amount: 10000000
    fds:
      single-transaction-threshold: 5000000
      rapid-repeated:
        window-minutes: 5
        min-count: 3
      late-night:
        threshold: 3000000
  transfer:
    otp:
      threshold-amount: 10000000
      expiry-minutes: 3
      max-attempts: 5
      cleanup:
        poll-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
