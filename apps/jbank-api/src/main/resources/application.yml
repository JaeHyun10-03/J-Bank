server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  application:
    name: jbank-api
  batch:
    job:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

jbank:
  batch:
    interest:
      rounding-mode: DOWN
    ctr:
      threshold-amount: 10000000
    fds:
      single-transaction-threshold: 5000000
      rapid-repeated:
        window-minutes: 5
        min-count: 3
      late-night:
        threshold: 3000000
  transfer:
    otp:
      threshold-amount: 10000000
      expiry-minutes: 3
      max-attempts: 5
      cleanup:
        poll-interval-ms: 60000
    # 이체의 수신 측 반영 워커(ADR 0012). 코드 기본값은 꺼짐이라 테스트·배치에서는 켜지 않는다.
    credit-worker:
      enabled: true
      poll-interval-ms: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # 관리 포트를 분리해도 본 포트에서 상태를 확인할 수 있게 /readyz·/livez를 본 포트에 둔다.
      group:
        readiness:
          include: readinessState,db
          additional-path: "server:/readyz"
        liveness:
          include: livenessState
          additional-path: "server:/livez"
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
