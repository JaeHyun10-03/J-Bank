spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

jbank:
  crypto:
    pii-key: ${PII_ENCRYPTION_KEY}
    hash-key: ${RESIDENT_REG_NO_HASH_KEY}
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.jbank: INFO
