name: backend-cd

on:
  push:
    branches: [main]
    paths:
      - "apps/jbank-api/**"
      - "infra/docker/jbank-api/**"
      - "infra/compose/**"
      - ".github/workflows/backend-cd.yml"

permissions:
  id-token: write # AWS OIDC
  contents: read
  packages: write # GHCR push

env:
  IMAGE: ghcr.io/jaehyun10-03/jbank-api

jobs:
  build-and-deploy:
    # infra/terraform으로 EC2·배포 역할이 만들어지기 전까지는 건너뛴다. 준비되면 저장소
    # Variables에 EC2_DEPLOY_READY=true, Secrets에 AWS_DEPLOY_ROLE_ARN·EC2_INSTANCE_ID를 넣는다
    # (둘 다 `terraform output`에서 나온다).
    if: ${{ vars.EC2_DEPLOY_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            -f infra/docker/jbank-api/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            apps/jbank-api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 인스턴스에는 SSH 포트가 없다. SSM Run Command로 저장소를 최신화하고 새 이미지
      # 태그로 api만 재기동한다(postgres·redis 등은 그대로). 결과를 폴링해 실패를 잡는다.
      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters '{"commands":["cd /opt/jbank && git fetch -q origin main && git reset -q --hard origin/main && IMAGE_TAG=${{ github.sha }} bash infra/compose/deploy.sh"]}' \
            --query Command.CommandId --output text)

          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
          [ "$STATUS" = "Success" ]
