name: backend-cd

on:
  push:
    branches: [main]
    paths:
      - "apps/jbank-api/**"
      - "infra/compose/**"
      - ".github/workflows/backend-cd.yml"
      - ".github/scripts/deploy-ec2.sh"
  # 인스턴스가 꺼진 시간의 동작 확인·재배포용. 배포 역할은 main 브랜치 토큰만 받는다.
  workflow_dispatch:

# 먼저 시작한 실행이 나중에 :latest를 덮지 않게 한 번에 하나씩 돈다.
concurrency:
  group: backend-cd

permissions:
  id-token: write # AWS OIDC
  contents: read
  packages: write # GHCR push

env:
  IMAGE: ghcr.io/jaehyun10-03/jbank-api

jobs:
  build-and-deploy:
    # infra/terraform으로 EC2·배포 역할이 만들어지기 전까지는 건너뛴다. 준비되면 저장소
    # Variables에 EC2_DEPLOY_READY=true, Secrets에 AWS_DEPLOY_ROLE_ARN·EC2_INSTANCE_ID를 넣는다
    # (둘 다 `terraform output`에서 나온다).
    if: ${{ vars.EC2_DEPLOY_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          # revision 라벨: 인스턴스가 꺼져 있던 동안 올라온 :latest를 부팅 작업이 알아보는 기준.
          docker build \
            -f apps/jbank-api/Dockerfile \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            apps/jbank-api
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      # 운영 인스턴스는 평일 09~18시에만 켜진다. 꺼져 있으면 배포를 건너뛰고(경고) 다음 부팅 때
      # 반영되고, 켜져 있으면 SSM으로 배포한다. 절차와 실패 조건은 스크립트 주석 참고.
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/deploy-ec2.sh
