<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" font-family="-apple-system, 'Apple SD Gothic Neo', 'Segoe UI', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1e1e1e" stroke-width="1.4"/></marker></defs><rect width="980" height="380" fill="#fff"/><circle cx="80" cy="150" r="46" fill="#fff" stroke="#1e1e1e" stroke-width="1.6"/><text x="80" y="146" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal">이체 다수</text><text x="80" y="167" font-size="12" fill="#5c5f66" text-anchor="middle" font-weight="normal">한 계좌로 집중</text><rect x="210" y="60" width="300" height="190" rx="14" fill="#fff" stroke="#1e1e1e" stroke-width="1.6"/><text x="228" y="86" font-size="13" fill="#5c5f66" text-anchor="start" font-weight="normal">이체 트랜잭션</text><rect x="235" y="100" width="250" height="52" rx="10" fill="#fff" stroke="#1e1e1e" stroke-width="1.6"/><text x="360.0" y="131.0" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal">송금 계좌 차감 · 차변 원장</text><rect x="235" y="170" width="250" height="56" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="1.6"/><text x="360.0" y="194.0" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal">입금 대기 1건 기록</text><text x="360.0" y="216.0" font-size="13" fill="#5c5f66" text-anchor="middle" font-weight="normal">pending_credits</text><rect x="660" y="60" width="280" height="80" rx="14" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="1.6"/><text x="800.0" y="96.0" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal">수신 계좌 (핫 계좌)</text><text x="800.0" y="118.0" font-size="13" fill="#5c5f66" text-anchor="middle" font-weight="normal">잔액 · 대변 원장</text><rect x="660" y="190" width="280" height="80" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="1.6"/><text x="800.0" y="226.0" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="normal">반영 워커 (200ms 주기)</text><text x="800.0" y="248.0" font-size="13" fill="#5c5f66" text-anchor="middle" font-weight="normal">계좌별 최대 500건 묶음</text><line x1="126" y1="150" x2="230" y2="150" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#a)"/><text x="178" y="140" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal">1</text><line x1="510" y1="100" x2="656" y2="100" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="6 5"/><text x="583" y="88" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal">FOR KEY SHARE</text><line x1="490" y1="205" x2="656" y2="225" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#a)"/><text x="573" y="203" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal">2</text><line x1="800" y1="186" x2="800" y2="144" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#a)"/><text x="815" y="170" font-size="14" fill="#1e1e1e" text-anchor="middle" font-weight="normal">3</text><text x="40" y="306" font-size="13" fill="#5c5f66" text-anchor="start" font-weight="normal">1 이체는 송금 계좌만 잠그고, 받는 쪽은 존재·상태만 확인한 뒤 입금 대기를 같은 트랜잭션에 기록</text><text x="40" y="328" font-size="13" fill="#5c5f66" text-anchor="start" font-weight="normal">2 워커가 받는 계좌별로 대기분을 SKIP LOCKED로 모음</text><text x="40" y="350" font-size="13" fill="#5c5f66" text-anchor="start" font-weight="normal">3 계좌 락 한 번에 잔액·대변 원장 반영. 대사는 차변 = 대변 + 미반영 입금</text></svg>