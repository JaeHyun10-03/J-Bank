openapi: 3.0.1
info:
  title: J-Bank API
  description: |
    ## 사용 전에 알아두면 좋은 것

    **1. 응답은 항상 같은 모양입니다.**
    ```json
    { "success": true, "data": { ... }, "error": null }
    { "success": false, "data": null, "error": { "code": "ACC_001_...", "message": "..." } }
    ```
    `success`만 보고 성공/실패를 먼저 판단하고, 실패면 `error.code`로 분기하세요.

    **2. 인증은 아직 없습니다(W3에서 추가 예정).**
    소유자 확인이 필요한 API(계좌 조회/상태변경/해지)는 임시로
    `customerId`를 쿼리 파라미터로 직접 받습니다. 로그인 붙기 전까지는
    프론트에서 이 값을 그대로 넘겨주세요.

    **3. 금액은 문자열입니다.**
    부동소수점 오차를 피하려고 `"10000.00"`처럼 문자열로 내려갑니다.
    숫자로 바로 파싱하지 말고 표시용 포맷 함수를 하나 두고 거기서만 다루세요.

    **4. 날짜/시각은 ISO 8601입니다.**
    예: `2026-07-21T09:30:00+09:00`.

    **5. 목록 조회는 페이지 응답입니다.**
    ```json
    { "content": [...], "page": 0, "size": 20, "totalElements": 3, "totalPages": 1 }
    ```
  version: v0 (W1)
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: 고객
  description: 고객 등록(CDD)과 강화된 고객확인(EDD) API
- name: 이체
  description: 계좌 이체 API
- name: 인증
  description: 로그인·토큰 재발급·로그아웃 API
- name: 계좌
  description: 계좌 개설·조회·상태변경·해지 API
- name: 거래
  description: 입금·출금·잔액·거래내역 API
- name: 상품
  description: 예적금 상품 목록·가입 API
paths:
  /api/v1/transfers:
    post:
      tags:
      - 이체
      summary: 계좌 이체
      description: |
        두 계좌번호를 오름차순 정렬한 순서로 락을 획득해 교착상태를 막고,
        출금 가능 금액 기준으로 검증한 뒤 단일 트랜잭션으로 커밋합니다.
        W2 기준 임계금액 초과에 따른 2차 인증 분기는 아직 없어 항상 즉시 완료됩니다(W5 예정).
      operationId: transfer
      parameters:
      - name: Idempotency-Key
        in: header
        description: 클라이언트가 생성한 UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseTransferResponse"
  /api/v1/products/{productCode}/subscriptions:
    post:
      tags:
      - 상품
      summary: 상품 가입
      description: 최소 가입금액 미달(PRD_001) 또는 판매중지 상품(PRD_002)이면 거절합니다.
      operationId: subscribe
      parameters:
      - name: productCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSubscribeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseProductSubscribeResponse"
  /api/v1/customers:
    post:
      tags:
      - 고객
      summary: 고객 등록
      description: |
        신규 고객을 등록하고 CDD(고객확인)를 함께 수행합니다. 인증이 필요 없습니다.
        같은 실명번호로 다시 등록하면 409(ACC_001)가 납니다.
        응답의 eddRequired가 true면 계좌 개설 전에 /edd API를 먼저 호출해야 합니다.
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseCustomerRegisterResponse"
  /api/v1/customers/{customerId}/edd:
    post:
      tags:
      - 고객
      summary: 강화된 고객확인(EDD) 등록
      description: |
        고위험으로 분류된 고객만 호출할 수 있습니다. 고위험이 아닌 고객이면
        409(ACC_004)가 납니다. 정상 처리되면 계좌 개설 게이트가 풀립니다.
      operationId: registerEdd
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EddRegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEddRegisterResponse"
  /api/v1/auth/refresh:
    post:
      tags:
      - 인증
      summary: 토큰 재발급
      description: 갱신 쿠키로 세 쿠키를 모두 새 값으로 교체합니다. X-CSRF-TOKEN 헤더가 필요합니다.
      operationId: refresh
      parameters:
      - name: refresh_token
        in: cookie
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseRefreshResponse"
  /api/v1/auth/logout:
    post:
      tags:
      - 인증
      summary: 로그아웃
      description: 갱신 토큰 화이트리스트를 비우고 세 쿠키를 모두 만료시킵니다.
      operationId: logout
      responses:
        "200":
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - 인증
      summary: 로그인
      description: bcrypt 검증 후 인증·갱신·위조방지 쿠키 세 개를 발급합니다.
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResponse"
  /api/v1/accounts:
    post:
      tags:
      - 계좌
      summary: 계좌 개설
      description: |
        고객의 CDD 완료 여부와 상태를 확인한 뒤 계좌를 개설합니다.
        W1 기준 초기 입금은 0원만 지원합니다(그 외 금액은 400).
      operationId: open
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountOpenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountOpenResponse"
  /api/v1/accounts/{accountId}/withdraw:
    post:
      tags:
      - 거래
      summary: 출금
      description: 출금 가능 금액(잔액-지급정지금액) 기준으로 검증합니다. Idempotency-Key 헤더가 필수입니다.
      operationId: withdraw
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        description: 클라이언트가 생성한 UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountTransactionResponse"
  /api/v1/accounts/{accountId}/deposit:
    post:
      tags:
      - 거래
      summary: 입금
      description: Idempotency-Key 헤더로 재요청을 멱등 처리합니다.
      operationId: deposit
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: Idempotency-Key
        in: header
        description: 클라이언트가 생성한 UUID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountTransactionResponse"
  /api/v1/accounts/{accountId}/status:
    patch:
      tags:
      - 계좌
      summary: 계좌 상태변경
      description: |
        ACTIVE↔SUSPENDED, ACTIVE/SUSPENDED→DORMANT, DORMANT→ACTIVE만 허용합니다.
        CLOSED로의 전환은 이 API로 할 수 없습니다(해지 API를 쓰세요). 허용되지 않는
        전이는 409(ACC_007)가 납니다. 운영자 전용이지만 운영자 역할 모델이 아직 없어
        인증된 사용자면 누구나 호출할 수 있습니다.
      operationId: changeStatus
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountStatusChangeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountStatusChangeResponse"
  /api/v1/products:
    get:
      tags:
      - 상품
      summary: 상품 목록 조회
      description: 판매중인 상품만 반환합니다. 인증이 필요 없습니다.
      operationId: list
      parameters:
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseProductSummaryResponse"
  /api/v1/customers/{customerId}/contracts:
    get:
      tags:
      - 상품
      summary: 고객별 가입 계약 조회
      description: 한 고객이 가입한 상품 계약을 페이지 단위로 조회합니다.
      operationId: list_1
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseContractSummaryResponse"
  /api/v1/customers/{customerId}/accounts:
    get:
      tags:
      - 계좌
      summary: 고객별 계좌 목록 조회
      description: |
        한 고객이 보유한 계좌를 페이지 단위로 조회합니다. status 쿼리 파라미터로
        특정 상태(ACTIVE, SUSPENDED 등)만 필터링할 수 있습니다. 원장이 아직 없어
        balance·holdAmount·availableBalance는 항상 0입니다(W2에서 실제 값 반영).
      operationId: list_2
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        description: "필터링할 계좌 상태, 생략하면 전체 조회"
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DORMANT
          - CLOSED
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseCustomerAccountSummaryResponse"
  /api/v1/accounts/{accountId}:
    get:
      tags:
      - 계좌
      summary: 계좌 상세조회
      description: 소유자가 아니면 403.
      operationId: getDetail
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountDetailResponse"
    delete:
      tags:
      - 계좌
      summary: 계좌 해지
      description: 잔액과 지급정지 금액이 모두 0원이어야 해지할 수 있습니다.
      operationId: close
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountCloseResponse"
  /api/v1/accounts/{accountId}/transactions:
    get:
      tags:
      - 거래
      summary: 거래내역 조회
      description: "type, from, to는 선택입니다. 목록 조회 공통 페이지 규칙을 따릅니다."
      operationId: getHistory
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - DEPOSIT
          - WITHDRAWAL
          - TRANSFER_IN
          - TRANSFER_OUT
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: pageable
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponsePageResponseTransactionSummaryResponse"
  /api/v1/accounts/{accountId}/balance:
    get:
      tags:
      - 계좌
      summary: 잔액 조회
      description: "balance는 잔액, availableBalance는 잔액에서 지급정지금액을 뺀 출금 가능 금액입니다."
      operationId: getBalance
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseBalanceResponse"
components:
  schemas:
    TransferRequest:
      required:
      - amount
      - fromAccountNumber
      - toAccountNumber
      type: object
      properties:
        fromAccountNumber:
          type: string
        toAccountNumber:
          type: string
        amount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        memo:
          maxLength: 200
          minLength: 0
          type: string
    ApiResponseTransferResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/TransferResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    TransferResponse:
      type: object
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - PENDING_OTP
          - COMPLETED
          - FAILED
          - CANCELLED
        fromAccountBalanceAfter:
          type: number
        processedAt:
          type: string
          format: date-time
    ProductSubscribeRequest:
      required:
      - accountNumber
      - subscriptionAmount
      type: object
      properties:
        accountNumber:
          type: string
        subscriptionAmount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
    ApiResponseProductSubscribeResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/ProductSubscribeResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ProductSubscribeResponse:
      type: object
      properties:
        contractNumber:
          type: string
        productCode:
          type: string
        subscribedAt:
          type: string
          format: date-time
        maturityAt:
          type: string
          format: date-time
    CustomerRegisterRequest:
      required:
      - birthDate
      - identityVerificationMethod
      - loginId
      - name
      - password
      - phone
      - residentRegNo
      type: object
      properties:
        name:
          type: string
        loginId:
          type: string
        password:
          type: string
        residentRegNo:
          type: string
        birthDate:
          type: string
          format: date
        phone:
          type: string
        address:
          type: string
        occupation:
          type: string
        identityVerificationMethod:
          type: string
          enum:
          - FACE_TO_FACE
          - NON_FACE_TO_FACE
        transactionPurpose:
          type: string
        fundSource:
          type: string
    ApiResponseCustomerRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/CustomerRegisterResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    CustomerRegisterResponse:
      type: object
      properties:
        customerId:
          type: string
        kycGrade:
          type: string
          enum:
          - GENERAL
          - CDD
          - EDD
        amlRiskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        status:
          type: string
          enum:
          - ACTIVE
          - DORMANT
          - CLOSED
        eddRequired:
          type: boolean
    EddRegisterRequest:
      required:
      - fundSource
      - supportingDocumentRef
      - transactionPurpose
      type: object
      properties:
        transactionPurpose:
          type: string
        fundSource:
          type: string
        supportingDocumentRef:
          type: string
    ApiResponseEddRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/EddRegisterResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    EddRegisterResponse:
      type: object
      properties:
        customerId:
          type: string
        amlRiskLevel:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        eddCompletedAt:
          type: string
          format: date-time
    ApiResponseRefreshResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/RefreshResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    RefreshResponse:
      type: object
      properties:
        accessTokenExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    LoginRequest:
      required:
      - loginId
      - password
      type: object
      properties:
        loginId:
          type: string
        password:
          type: string
    ApiResponseLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/LoginResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    LoginResponse:
      type: object
      properties:
        customerId:
          type: string
        name:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    AccountOpenRequest:
      required:
      - initialDeposit
      - productType
      type: object
      properties:
        productType:
          type: string
          enum:
          - CHECKING
        initialDeposit:
          type: number
    AccountOpenResponse:
      type: object
      properties:
        accountId:
          type: string
        accountNumber:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DORMANT
          - CLOSED
        openedAt:
          type: string
          format: date-time
    ApiResponseAccountOpenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/AccountOpenResponse"
        error:
          $ref: "#/components/schemas/ErrorDetail"
    DepositRequest:
      required:
      - amount
      - channel
      type: object
      properties:
        amount:
          minimum: 0.01
          exclusiveMinimum: false
          type: number
        channel:
          type: string
    AccountTransactionResponse:
      type: object
      properties:
        transactionId:
          type: string
        accountId:
          type: string
        type:
          type: string
          enum:
          - DEPOSIT
          - WITHDRAWAL
          - TRANSFER
        amount:
          type: number
        balanceAfter:
          type: number
        processedAt:
          type: string
          format: date-time
    ApiResponseAccountTransactionResponse:
      type: object
