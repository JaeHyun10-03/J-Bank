apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "jbank-product.fullname" . }}
  labels:
    {{- include "jbank-product.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "jbank-product.labels" . | nindent 6 }}
