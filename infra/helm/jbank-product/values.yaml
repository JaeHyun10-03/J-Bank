# 기본값. 환경별 값은 values-dev.yaml / values-prod.yaml에서 덮어쓴다.
# jbank-api 차트와 같은 패턴 — 근거는 그쪽 values.yaml 주석 참고.

image:
  repository: jbank-product
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

terminationGracePeriodSeconds: 30

springProfilesActive: local

secretName: jbank-api-secrets

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 384Mi
  limits:
    memory: 768Mi

podDisruptionBudget:
  maxUnavailable: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}
