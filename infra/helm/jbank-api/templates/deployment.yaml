apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jbank-api.fullname" . }}
  labels:
    {{- include "jbank-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "jbank-api.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "jbank-api.labels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: jbank-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfilesActive | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretName }}
          # readiness는 DB 연결까지 확인, liveness는 프로세스 상태만 확인한다.
          # 같은 엔드포인트를 쓰면 DB 지연만으로 컨테이너가 통째로 재시작된다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
