# 기본값. 환경별 값은 values-dev.yaml / values-prod.yaml에서 덮어쓴다.

image:
  repository: jbank-api
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# 애플리케이션 쪽 graceful shutdown(timeout-per-shutdown-phase: 20s)보다
# 여유를 둬서, SIGTERM 이후 강제 종료(SIGKILL) 전에 진행중 요청이 먼저
# 정리될 시간을 준다.
terminationGracePeriodSeconds: 30

springProfilesActive: local

# jbank-api가 필요로 하는 시크릿(DB_URL, DB_USERNAME, DB_PASSWORD,
# REDIS_HOST, REDIS_PORT, KAFKA_BOOTSTRAP_SERVERS, PII_ENCRYPTION_KEY,
# RESIDENT_REG_NO_HASH_KEY, JWT_SECRET)이 담긴 Secret 이름.
# 이번 주 목요일 External Secrets Operator 도입 전까지는 클러스터에
# 수동으로 생성해둔 Secret을 가리킨다.
secretName: jbank-api-secrets

service:
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

podDisruptionBudget:
  maxUnavailable: 1

# CPU 기준만 우선 적용. 초당 요청수(RPS) 기준은 custom.metrics.k8s.io를
# 채워줄 Prometheus Adapter를 EKS에 별도로 배포해야 가능한데, 지금
# observability 스택은 docker-compose에만 있고 클러스터엔 없다 —
# 후속 작업으로 남겨둔다.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

nodeSelector: {}

# API 서버와 같은 이미지, 실행 인자와 스케줄만 다르게 준 배치 잡.
# runDate가 필요한 잡(만기이자/CTR)은 requiresRunDate: true로 표시한다.
batchJobs:
  - name: interestMaturityJob
    schedule: "0 1 * * *"
    requiresRunDate: true
  - name: ctrDetectionJob
    schedule: "0 2 * * *"
    requiresRunDate: true
  - name: ledgerReconciliationJob
    schedule: "0 3 * * *"
    requiresRunDate: false
  - name: fdsDetectionJob
    schedule: "0 4 * * *"
    requiresRunDate: true

batchResources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi
