# ArgoCD가 지켜보는 실제 배포 이미지. GitOps 원칙상 desired state는 전부
# Git에 있어야 한다 — backend-cd.yml이 `helm upgrade --set image.tag=...`로
# 클러스터에 직접 값을 꽂는 방식은 ArgoCD의 selfHeal(자동 동기화 앱만 해당)이
# "Git에 없는 값"으로 보고 되돌려버려서 GitOps와 근본적으로 안 맞는다
# (docs/adr/0006-w7-gitops-image-tag.md).
#
# 그래서 이 파일만 backend-cd.yml이 이미지 푸시 성공 후 git commit·push로
# 갱신한다 — helm --set이 아니라 "Git을 고쳐서 ArgoCD가 스스로 끌어가게"
# 하는 방식. values.yaml/values-dev.yaml/values-prod.yaml은 계정 ID가
# 들어간 레지스트리 URL을 그대로 두지 않으려던 원래 취지를 유지하고,
# 실제 레지스트리·태그는 이 파일 하나로만 흐른다.
image:
  repository: jbank-api
  tag: latest
