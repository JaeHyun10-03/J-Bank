# postgres_exporter 기본 지표에는 락 대기 세션 수가 없어 추가한다(REQ-05).
pg_lock_waiting:
  query: "SELECT count(*) AS sessions FROM pg_stat_activity WHERE datname = current_database() AND wait_event_type = 'Lock'"
  metrics:
    - sessions:
        usage: "GAUGE"
        description: "Lock 대기 중인 세션 수"
pg_activity_state:
  query: "SELECT coalesce(state, 'unknown') AS state, count(*) AS sessions FROM pg_stat_activity WHERE datname = current_database() GROUP BY 1"
  metrics:
    - state:
        usage: "LABEL"
        description: "세션 상태"
    - sessions:
        usage: "GAUGE"
        description: "상태별 세션 수"
