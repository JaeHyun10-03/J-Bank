# perf 대상 EC2의 스택. 운영(../docker-compose.prod.yml)과 같은 서비스·이미지·JVM 옵션을 쓰고,
# 측정에 필요한 것만 다르게 둔다. 차이 목록은 perf/README.md "운영과 다른 점" 절에 있다.
#   - prometheus·grafana 없음(부하 발생기로 이동, docker-compose.loadgen.yml)
#   - caddy는 공인 도메인이 없어 내부 CA(tls internal) 인증서로 대상 사설 IP를 서빙
#   - node_exporter·cAdvisor·postgres_exporter 추가(읽기 전용 마운트, 부하 발생기 SG에서만 접근)
#   - /actuator/prometheus가 인증을 요구해 metrics-proxy가 perf 전용 계정으로 로그인해 대신 가져온다
#   - PG 느린 쿼리(200ms)·락 대기 로그, api Tomcat 스레드 지표, 컨테이너 로그 로테이션
#   - PG 데이터는 회차마다 복사본으로 되돌리기 쉽도록 호스트 경로(/opt/perf-pgdata)에 둔다
# 실행: docker compose -f docker-compose.target.yml --env-file .env up -d
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "443:443"
    environment:
      PERF_HOST: ${PERF_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api

  api:
    image: ghcr.io/jaehyun10-03/jbank-api:${IMAGE_TAG}
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/jbank
      DB_USERNAME: jbank
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=128m
      # 운영과 다른 점: Tomcat 스레드 지표(tomcat_threads_busy_threads) 노출만 켠다.
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"
      # 운영과 다른 점: 관리 엔드포인트(actuator)를 별도 포트·커넥터로 분리한다. 본 포트(8080) 작업 스레드가
      # 포화돼도 지표 수집·readiness가 막히지 않게 하기 위해서다(1차 측정에서 포화 구간 지표가 끊김).
      # 호스트에는 매핑하지 않는다 — 수집은 metrics-proxy가 컨테이너 네트워크로 한다.
      MANAGEMENT_SERVER_PORT: "9095"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - log_lock_waits=on
    environment:
      POSTGRES_DB: jbank
      POSTGRES_USER: jbank
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${PG_DATA_DIR:-/opt/perf-pgdata}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    logging: *logging
    command: ["--path.rootfs=/host"]
    pid: host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    logging: *logging
    command: ["--docker_only=true", "--housekeeping_interval=5s"]
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  # api 지표 프록시(perf/ec2/metrics_proxy.py). Prometheus는 api:8080 대신 이것(:9091/metrics)을 긁는다.
  metrics-proxy:
    image: python:3.12-alpine
    restart: unless-stopped
    logging: *logging
    command: ["python3", "/app/metrics_proxy.py"]
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD}
      METRICS_URL: http://api:9095/actuator/prometheus
    ports:
      - "9091:9091"
    volumes:
      - ../../../perf/ec2/metrics_proxy.py:/app/metrics_proxy.py:ro
    depends_on:
      - api

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    logging: *logging
    command: ["--extend.query-path=/etc/postgres-exporter/queries.yml"]
    environment:
      DATA_SOURCE_NAME: postgresql://jbank:${DB_PASSWORD}@postgres:5432/jbank?sslmode=disable
    ports:
      - "9187:9187"
    volumes:
      - ./postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
