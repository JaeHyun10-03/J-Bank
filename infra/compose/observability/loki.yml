# 단일 바이너리·파일시스템 저장. 로그 15일 보관(ADR 0014).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 360h

# retention_period만으로는 지워지지 않는다 — compactor가 retention을 켜야 삭제한다.
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# 기본 내장 캐시(각 100MB)는 메모리 상한(192MB)을 넘기므로 줄인다.
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 16

analytics:
  reporting_enabled: false
