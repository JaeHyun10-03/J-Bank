global:
  scrape_interval: 15s

scrape_configs:
  # api의 관리 포트(Compose 내부 전용). 본 포트 8080에는 actuator가 없다(ADR 0013).
  - job_name: jbank-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9095"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

# 규칙 디렉터리는 glob으로 지정한다 — 규칙 디렉터리를 마운트하기 전의 기존 컨테이너도 이 설정으로 기동한다.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
