# EC2 단일 인스턴스 배포 구성. 로컬용 docker-compose.yml과 별도 파일로 두는 이유:
# 프로파일·호스트 포트·빌드 컨텍스트가 전부 다르고, 오버라이드로 "빼는" 건 Compose가
# 지원하지 않아 한 파일에 합치면 오히려 읽기 어렵다.
#
# 비밀값은 같은 디렉터리의 .env(.gitignore 대상)에서 읽는다 — .env.example 참고.
# 실행: docker compose -f docker-compose.prod.yml up -d --pull always
# 외부 진입은 caddy(80/443)만. 나머지는 Compose 내부 네트워크로만 통신한다.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - grafana

  api:
    image: ghcr.io/jaehyun10-03/jbank-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/jbank
      DB_USERNAME: jbank
      REDIS_HOST: redis
      # t3.small(2GB)에서 postgres·prometheus·grafana와 함께 산다. 힙 상한을 명시하지
      # 않으면 JVM이 컨테이너 메모리의 1/4만 잡아 오히려 부족하고, 너무 크게 잡으면
      # 이웃을 밀어낸다.
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=128m
      # actuator를 Compose 내부 전용 관리 포트로 분리한다(ADR 0013). 호스트에 매핑하지 않고
      # Caddy도 8080만 프록시하므로 외부에서 닿지 않는다. 이 포트의 /actuator/prometheus만 인증 없이 열린다.
      MANAGEMENT_SERVER_PORT: "9095"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9095/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16
    restart: unless-stopped
    # deadlock_timeout(기본 1초)보다 오래 락을 기다린 쿼리를 로그로 남긴다. 교착 자체는 기본으로 남는다.
    # 이 줄이 바뀌면 deploy.sh의 `up -d api`가 postgres를 재생성한다 — 병합은 18시 이후(runbook).
    command: ["postgres", "-c", "log_lock_waits=on"]
    environment:
      POSTGRES_DB: jbank
      POSTGRES_USER: jbank
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jbank"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  # 교착 카운터(pg_stat_database_deadlocks)와 DB 접속 상태(pg_up)를 Prometheus로 낸다.
  # 기존 superuser 계정을 쓴다 — 전용 계정(pg_monitor)은 수동 SQL이 필요해 후속 과제(ADR 0014).
  # 비밀번호를 URL에 넣지 않는다: base64 비밀번호의 / + = 가 주소 해석을 깨뜨린다.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    mem_limit: 32m
    environment:
      DATA_SOURCE_URI: postgres:5432/jbank?sslmode=disable
      DATA_SOURCE_USER: jbank
      DATA_SOURCE_PASS: ${DB_PASSWORD}

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.j-bank.site
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/provisioning:/etc/grafana/provisioning:ro

  # 로그 수집(loki·alloy·socket-proxy)은 logs 프로필이다. .env의 COMPOSE_PROFILES=logs로 켠다.
  # 메모리 여유가 기준(유휴 600MiB, 배치 중 150MiB)보다 작으면 .env에서 빼고 세 서비스를 멈춘다 —
  # 그러면 이후 전체 `up -d`에도 다시 올라오지 않는다(ADR 0014, docs/runbook/observability.md).
  loki:
    image: grafana/loki:3.7.8
    profiles: ["logs"]
    restart: unless-stopped
    mem_limit: 192m
    command: ["-config.file=/etc/loki/loki.yml"]
    environment:
      GOMEMLIMIT: 160MiB
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.20.1
    profiles: ["logs"]
    restart: unless-stopped
    mem_limit: 96m
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: 80MiB
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks: [default, docker-api]
    depends_on: [socket-proxy, loki]

  # 도커 소켓은 이 프록시만 연다. 컨테이너 목록·inspect·로그와 네트워크 목록 GET만 허용하고 나머지
  # (쓰기·archive·exec)는 거부한다. docker-api 네트워크에는 alloy만 붙는다. inspect 응답에는 api의
  # 환경변수가 들어 있어, alloy가 침해되면 비밀값이 보일 수 있다 — 수용한 위험(ADR 0014).
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    profiles: ["logs"]
    restart: unless-stopped
    mem_limit: 16m
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=(/v[0-9.]+)?/(_ping|version|networks|containers/json|containers/[a-zA-Z0-9_.-]+/(json|logs))
      - -allowHEAD=(/v[0-9.]+)?/_ping
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]

networks:
  docker-api:
    internal: true

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
  loki-data:
  alloy-data:
